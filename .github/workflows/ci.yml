name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Require EVERY pattern to match, not the default `some` (OR). With
          # OR, the negation `!backend/**/*.md` matches every file that isn't a
          # backend markdown file (i.e. almost everything), so the `backend`
          # filter was always true and the eval job ran on every push. With
          # `every`, a file counts only if it's under backend/ AND is not a
          # backend markdown file -- i.e. a real backend code change.
          predicate-quantifier: 'every'
          filters: |
            backend:
              - 'backend/**'
              - '!backend/**/*.md'

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 python3-tk python3-dev xvfb

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run tests (Linux, headless display)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest -v

      # Works around a known upstream bug (actions/setup-python#1102,
      # astral-sh/python-build-standalone#939): tkinter randomly fails with
      # "Can't find a usable init.tcl" on Windows when running inside a venv
      # (sys.prefix != sys.base_prefix) with a non-interactive stdin, which is
      # always true for a non-TTY GitHub Actions step. In that combination, Tk's
      # console-window init spawns a second Tcl interpreter that doesn't inherit
      # the tcl_library value Python computed, so it falls back to a
      # nondeterministic auto-search for its script library. Setting
      # TCL_LIBRARY/TK_LIBRARY explicitly sidesteps this.
      #
      # Crucially, select the directory that actually contains init.tcl / tk.tcl
      # rather than the first glob("tcl8*") hit: a Tcl install ships both a
      # `tcl8` "Tcl Modules" dir (no init.tcl) and the real `tcl8.6` script
      # library, and glob order is filesystem order -- picking `tcl8` silently
      # defeats this workaround and leaves Tk on its flaky fallback. Derived
      # from sys.base_prefix so it tracks whichever Python/tcl the runner ships.
      # (tests/conftest.py applies the same fix in-process as the real guard;
      # this step just makes the CI environment consistent for good measure.)
      - name: Set Tcl/Tk library paths (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          uv run python - <<'PY' >> "$GITHUB_ENV"
          import sys
          from pathlib import Path

          def find(patterns, required_file):
              tcl_dir = Path(sys.base_prefix) / "tcl"
              for pattern in patterns:
                  for candidate in sorted(tcl_dir.glob(pattern)):
                      if (candidate / required_file).is_file():
                          return candidate
              raise SystemExit(f"no dir matching {patterns} contains {required_file}")

          print(f"TCL_LIBRARY={find(('tcl9*', 'tcl8*'), 'init.tcl').as_posix()}")
          print(f"TK_LIBRARY={find(('tk9*', 'tk8*'), 'tk.tcl').as_posix()}")
          PY

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: uv run pytest -v

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run tests
        working-directory: backend
        run: uv run pytest -v

  test-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Run tests
        working-directory: mobile
        run: npm test

  backend-evals:
    needs: [test-backend, changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --locked

      # Prefer a pre-warmed remote Ollama server (tunneled via ngrok) when it's reachable --
      # it's faster than provisioning + pulling the model fresh on the runner every time.
      # Falls back to the local install below whenever the tunnel is down, so this job never
      # hard-depends on infra outside CI. The URL is a secret so it isn't exposed in logs.
      - name: Check remote eval server availability
        id: remote_check
        env:
          REMOTE_OLLAMA_URL: ${{ secrets.REMOTE_OLLAMA_URL }}
        run: |
          if [ -n "$REMOTE_OLLAMA_URL" ] && curl -sf --max-time 10 "$REMOTE_OLLAMA_URL" >/dev/null; then
            echo "remote Ollama server is up, using it"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "remote Ollama server is not reachable, falling back to local Ollama"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Ollama
        if: steps.remote_check.outputs.available == 'false'
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        if: steps.remote_check.outputs.available == 'false'
        run: |
          ollama serve &
          for i in $(seq 1 60); do
            curl -sf http://localhost:11434 >/dev/null && exit 0
            sleep 1
          done
          echo "ollama server did not come up in time" >&2
          exit 1

      - name: Pull gemma4:e4b
        if: steps.remote_check.outputs.available == 'false'
        run: ollama pull gemma4:e4b

      - name: Run note generator evals
        working-directory: backend
        env:
          OLLAMA_BASE_URL: ${{ steps.remote_check.outputs.available == 'true' && secrets.REMOTE_OLLAMA_URL || 'http://localhost:11434' }}
          OLLAMA_NOTE_MODEL: gemma4:e4b
        run: uv run python -m evals.note_generator_evals

  build-windows-exe:
    needs: [test, backend-evals]
    # backend-evals is skipped entirely when backend/ didn't change (see the
    # `changes` job); a skipped dependency fails the implicit success() check
    # that gates downstream jobs by default, so this must be spelled out
    # explicitly rather than left to the default `if`.
    if: always() && needs.test.result == 'success' && (needs.backend-evals.result == 'success' || needs.backend-evals.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build VetScribe.exe (--onedir)
        run: uv run pyinstaller build_spec/vetscribe.spec --distpath dist --workpath build

      - name: Upload VetScribe.exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: VetScribe-windows
          path: dist/VetScribe

      # The backend is a separate uv project with its own deps (fastapi/uvicorn/
      # httpx), so it builds in its own env. This is the windowless backend exe
      # the desktop app's BackendSupervisor launches on the clinic PC.
      - name: Sync backend dependencies
        run: uv sync --locked
        working-directory: backend

      - name: Install PyInstaller (backend env)
        run: uv pip install pyinstaller
        working-directory: backend

      - name: Build VetScribeBackend.exe (--onedir)
        run: uv run pyinstaller build_spec/backend.spec --distpath dist --workpath build
        working-directory: backend

      - name: Upload VetScribeBackend.exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: VetScribeBackend-windows
          path: backend/dist/VetScribeBackend
