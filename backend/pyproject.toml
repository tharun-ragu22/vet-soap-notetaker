[project]
name = "vet_soap_notetaker_backend"
version = "0.1.0"
description = "Reference SOAP-note generation backend for Vet Soap Notetaker Assistant: pluggable STT/LLM providers behind a single HTTP contract"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pydantic-ai-slim[openai]>=2.43.0",
    "pydantic-evals>=2.43.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]
# Build-only tooling: PyInstaller freezes the backend into the windowless Windows
# exe the installer ships to {app}\backend. Not a runtime dependency, so it lives
# in its own group, installed with `uv run --group build pyinstaller`.
build = [
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vet_soap_notetaker_backend"]
