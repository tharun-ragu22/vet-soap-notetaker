[project]
name = "vet_soap_notetaker_assistant"
version = "0.1.0"
description = "System tray assistant that records exam-room audio, generates SOAP notes, and injects them into AVImark"
requires-python = ">=3.11"
dependencies = [
    "pystray>=0.19.5",
    "pillow>=10.0.0",
    "sounddevice>=0.4.6",
    "scipy>=1.11.0",
    "httpx>=0.27.0",
    "pyperclip>=1.8.2",
    "pynput>=1.7.6",
    "pywin32>=306; sys_platform == 'win32'",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]
# Build-only tooling: PyInstaller freezes the desktop app into the Windows exe
# the installer ships. Not a runtime dependency (the clinic PC never needs it),
# so it lives in its own group, installed with `uv run --group build pyinstaller`.
build = [
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vet_soap_notetaker"]
